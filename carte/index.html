ope.","realite":"Intéressant surtout pour la ligne 'Made in Japan' et les coloris locaux ; les prix standard ne sont pas notablement plus bas que l'Europe. Existence confirmée par Navitime et OSM, mais horaires non trouvés.","note":3.0,"conseil":"Si vous cherchez les 990/992/993 : comparez avec le prix européen avant d'acheter, tax-free inclus.","reservation":"inutile","url_source":"https://japantravel.navitime.com/en/area/jp/guide/NTJculture0018-en/","a_verifier":["horaires","sortie","prix","pointures larges","Page Tokyo Art Beat (adresse 4-32-16 Jingumae), date de mise à jour inconnue ; horaires non confirmés sur site officiel"]},{"id":"kith-tokyo","nom":"KITH Tokyo (Miyashita Park)","nom_jp":"キス トーキョー","theme":"vetements","sous_theme":"streetwear / sneakers","quartier":"Shibuya","lat":35.66303,"lon":139.702,"adresse":"Miyashita Park North, 6-20-10 Jingumae, Shibuya-ku","gare":"Shibuya","ligne":"JR Yamanote, Metro Ginza/Fukutoshin/Hanzomon","sortie":"Sortie non confirmée : suivre Google Maps depuis la gare indiquée","horaires":"11:00-21:00 tous les jours","prix":"hoodies, tee-shirts et sneakers Kith : prix premium (non relevés)","description":"Flagship Kith dans Miyashita Park avec une salle vêtements et une salle sneakers (paires au plafond), conçue par Snarkitecture. Kith Treats (céréales/glaces) à l'étage.","attente":"Le temple du streetwear new-yorkais à Tokyo.","realite":"Très beau lieu et excellent pour tourner, mais c'est une boutique de marque US : prix élevés et pas d'avantage de prix par rapport à l'Europe. Attention aux files lors des drops.","note":3.5,"conseil":"Allez-y en semaine à l'ouverture ; Miyashita Park offre aussi une terrasse et des boutiques à pied de Shibuya.","reservation":"inutile","url_source":"https://www.timeout.com/tokyo/shopping/kith-tokyo","a_verifier":["sortie exacte","prix","taille/stock","Sortie non trouvée. Sources divergentes : Tabelog ~513 m de Shibuya ; un guide dit ~7 min depuis la sortie Hachiko JR ; Japan Travel parle de var compte={};LIEUX.forEach(function(p){compte[p.theme]=(compte[p.theme]||0)+1});
var tout=document.createElement('button');tout.type='button';tout.className='tk-chip tk-tout';tout.setAttribute('aria-pressed','true');tout.innerHTML='Tout <small>'+LIEUX.length+'</small>';bar.appendChild(tout);
var chips={};
THEMES.forEach(function(t){if(!compte[t[0]])return;var b=document.createElement('button');b.type='button';b.className='tk-chip';b.style.setProperty('--c',t[3]);b.setAttribute('aria-pressed','true');b.innerHTML='<i></i>'+esc(t[2])+' <small>'+compte[t[0]]+'</small>';b.onclick=function(){
 var tous=THEMES.every(function(x){return !compte[x[0]]||actifs[x[0]]});
 if(tous){THEMES.forEach(function(x){actifs[x[0]]=(x[0]===t[0])})}else{actifs[t[0]]=!actifs[t[0]];if(!THEMES.some(function(x){return actifs[x[0]]&&compte[x[0]]}))THEMES.forEach(function(x){actifs[x[0]]=true})}
 majChips();rendre(true)};bar.appendChild(b);chips[t[0]]=b});
function majChips(){var tous=true;Object.keys(chips).forEach(function(k){chips[k].setAttribute('aria-pressed',actifs[k]?'true':'false');if(!actifs[k])tous=false});tout.setAttribute('aria-pressed',tous?'true':'false')}
tout.onclick=function(){THEMES.forEach(function(x){actifs[x[0]]=true});majChips();rendre(true)};
/* le gratin : note ≥ 4 */
var gBtn=document.getElementById('tk-gratin');var nG=LIEUX.filter(function(p){return p.g}).length;document.getElementById('tk-gratin-n').textContent=nG;
function majGratin(){gBtn.setAttribute('aria-pressed',gratinOn?'true':'false')}
gBtn.onclick=function(){gratinOn=!gratinOn;majGratin();rendre(true)};majGratin();
/* quartiers */
var qSel=document.getElementById('tk-quartier');
var qs={};LIEUX.forEach(function(p){qs[p.quartier]=(qs[p.quartier]||0)+1});
Object.keys(qs).sort(function(a,b){return qs[b]-qs[a]||a.localeCompare(b)}).forEach(function(q){var o=document.createElement('option');o.value=q;o.textContent=q+' ('+qs[q]+')';qSel.appendChild(o)});
qSel.onchange=function(){quartierSel=qSel.value;rendre(true);if(quartierSel)zoomGroupe(visibles().filter(function(p){return p.quartier===quartierSel}))};
document.getElementById('tk-q').oninput=function(e){texte=norm(e.target.value.trim());rendre(true)};
document.getElementById('tk-reset').onclick=function(){THEMES.forEach(function(x){actifs[x[0]]=true});majChips();gratinOn=false;majGratin();texte='';document.getElementById('tk-q').value='';quartierSel='';qSel.value='';fermer();map.flyToBounds(VUE,{duration:.8,padding:[10,10]});rendre(true)};
function visibles(){return LIEUX.filter(function(p){return actifs[p.theme]&&(!gratinOn||p.g)&&(!quartierSel||p.quartier===quartierSel)&&(!texte||p._h.indexOf(texte)>-1)})}
function zoomGroupe(ps){if(!ps.length)return;var b=L.latLngBounds(ps.map(function(p){return [p.lat,p.lon]}));var z=Math.min(16,Math.max(ZOOM_PINS,map.getBoundsZoom(b.pad(.25))));map.flyTo(b.getCenter(),z,{duration:.7})}
function pinIcon(p,on,pop,i){var t=TH[p.theme]||TH.autre;return L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,34],html:'<div class="tk-pinw'+(on?' on':'')+(pop?' pop':'')+(p.g?' g':'')+'" style="--c:'+t.c+';--dl:'+(pop?Math.min(i*12,500):0)+'ms"><div class="tk-pin"><span>'+t.e+'</span></div></div>'})}
function rendre(pop){
 layer.clearLayers();
 var ps=visibles();
 document.getElementById('tk-compte').textContent=ps.length+' lieu'+(ps.length>1?'x':'')+(gratinOn?' du gratin':'')+' sur '+LIEUX.length;
 var z=map.getZoom();var g={};ps.forEach(function(p){(g[p.quartier]=g[p.quartier]||[]).push(p)});
 var i=0;
 Object.keys(g).forEach(function(q){var arr=g[q];
  if(z<ZOOM_PINS&&arr.length>1&&!quartierSel){
   var la=0,lo=0;arr.forEach(function(p){la+=p.lat;lo+=p.lon});la/=arr.length;lo/=arr.length;
   var d=Math.round(36+Math.min(arr.length,25)*1.2);
   var m=L.marker([la,lo],{icon:L.divIcon({className:'',iconSize:[d,d],iconAnchor:[d/2,d/2],html:'<div class="tk-bulle'+(pop?' pop':'')+'" style="width:'+d+'px;height:'+d+'px;--dl:'+Math.min(i*30,400)+'ms"><div><b>'+arr.length+'</b><em>'+esc(q)+'</em></div></div>'}),title:q+' : '+arr.length+' lieux',keyboard:true,zIndexOffset:2000-arr.length*10});
   m.on('click',function(){zoomGroupe(arr)});m.addTo(layer);i++;
  }else{
   arr.forEach(function(p){var m=L.marker([p.lat,p.lon],{icon:pinIcon(p,sel===p.id,pop,i),title:p.nom,alt:p.nom,keyboard:true,riseOnHover:true,zIndexOffset:sel===p.id?1000:0});
    m.on('click',function(){ouvrir(p,false)});m.addTo(layer);i++})
  }});
}
function ligneInfo(k,v){return v?'<dt>'+k+'</dt><dd>'+esc(v)+'</dd>':''}
function srcTr(t){return t[4]&&urlOk(t[3])?'<a class="tk-src" href="'+esc(t[3])+'" target="_blank" rel="noopener noreferrer">source ↗</a>':'<span class="tk-est">estimation</span>'}
/* trajet sourcé depuis la gare du logement, si la gare de la fiche est une destination connue */
function trajetPour(p){if(!maison||!MAISON_PUB||!MAISON_PUB.trajets||!maison.court||maison.court!==MAISON_PUB.court)return null;
 var toks=String(p.gare||'').split(/[\/(+]/).map(function(s){return norm(s).replace(/^\s*(ou|et)\s+/,'').replace(/[^a-z0-9\- ]/g,'').trim()}).filter(Boolean);
 for(var i=0;i<MAISON_PUB.trajets.length;i++){var t=MAISON_PUB.trajets[i];var noms=[];String(t[0]).split(/[()]/).forEach(function(s){s=norm(s).trim();if(s){noms.push(s);noms.push(s.replace(/ station$/,''))}});
  if(toks.some(function(k){return noms.indexOf(k)>-1}))return t}
 return null}
function blocDepuis(p){
 if(!maison)return '<div class="tk-dep"><strong>Depuis le logement</strong><span>Réglez votre logement (bouton « Logement ») pour voir la distance et le trajet.</span></div>';
 var km=distKm(maison.lat,maison.lon,p.lat,p.lon);
 var h='<div class="tk-dep"><strong>Depuis '+esc(maison.court||maison.nom)+'</strong><div>'+fmtKm(km)+' km à vol d’oiseau</div>';
 var t=trajetPour(p);
 if(t)h+='<div class="tk-tr">'+(maison.marche?esc(maison.marche)+' min à pied jusqu’à '+esc(MAISON_PUB.gare)+', puis ':'')+'<b>'+esc(t[1])+' min</b> <span class="tk-tr2">'+esc(t[2])+' → '+esc(t[0])+'</span> '+srcTr(t)+'</div>';
 h+='<a class="tk-btn gm" href="https://www.google.com/maps/dir/?api=1&origin='+maison.lat+','+maison.lon+'&destination='+p.lat+','+p.lon+'&travelmode=transit" target="_blank" rel="noopener noreferrer">Itinéraire en transports ↗</a></div>';
 return h}
var fiche=document.getElementById('tk-fiche');
function ouvrir(p,deplacer){
 sel=p.id;panneau='lieu';var t=TH[p.theme]||TH.autre;
 var note=p.note?'<span class="tk-note">Note '+esc(p.note)+' / 5</span>':'';
 var h='<div class="tk-fiche-tete" style="--c:'+t.c+'"><button class="tk-x" type="button" aria-label="Fermer la fiche">×</button><div class="tk-th">'+esc(t.n)+(p.sous_theme?' · '+esc(p.sous_theme):'')+' · '+esc(p.quartier)+(p.g?' · gratin':'')+'</div><h3>'+esc(p.nom)+'</h3>'+(p.nom_jp?'<div class="tk-jp">'+esc(p.nom_jp)+'</div>':'')+'</div><div class="tk-corps">';
 h+='<div class="tk-metro"><strong>Gare et sortie</strong><div class="tk-sortie">'+esc(p.gare||'—')+(p.sortie?' · '+esc(p.sortie):'')+'</div>'+(p.ligne?'<div>'+esc(p.ligne)+'</div>':'')+'</div>';
 h+=blocDepuis(p);
 h+='<dl class="tk-info">'+ligneInfo('Adresse',p.adresse)+ligneInfo('Horaires',p.horaires)+ligneInfo('Prix',p.prix)+ligneInfo('Réserver',p.reservation)+'</dl>';
 if(p.description)h+='<div>'+esc(p.description)+'</div>';
 if(p.attente||p.realite)h+='<div class="tk-av">'+(p.attente?'<div class="a"><b>Ce qu’on attend</b>'+esc(p.attente)+'</div>':'')+(p.realite?'<div class="r"><b>La réalité '+note+'</b>'+esc(p.realite)+'</div>':'')+'</div>';
 if(p.conseil)h+='<div><b>Conseil :</b> '+esc(p.conseil)+'</div>';
 h+='<div class="tk-liens">'+(urlOk(p.url_source)?'<a class="tk-btn src" href="'+esc(p.url_source)+'" target="_blank" rel="noopener noreferrer">Source ↗</a>':'')+'<a class="tk-btn gm" href="https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lon+'" target="_blank" rel="noopener noreferrer">Google Maps ↗</a></div>';
 if(p.a_verifier&&p.a_verifier.length)h+='<div class="tk-av2">À vérifier sur place : '+esc(p.a_verifier.join(' ; '))+'</div>';
 h+='</div>';
 fiche.innerHTML=h;fiche.style.setProperty('--c',t.c);fiche.scrollTop=0;fiche.classList.add('ouverte');
 fiche.querySelector('.tk-x').onclick=fermer;
 document.getElementById('tk-aide').style.opacity=0;
 var z=deplacer?Math.max(map.getZoom(),ZOOM_PINS+1):map.getZoom();var sz=map.getSize(),mob=window.innerWidth<=700;var cx=mob?sz.x/2:(sz.x-400)/2,cy=mob?sz.y*0.22:sz.y/2;
 var c=map.unproject(map.project([p.lat,p.lon],z).subtract([cx-sz.x/2,cy-sz.y/2]),z);map.flyTo(c,z,{duration:deplacer?.8:.5});
 try{history.replaceState(null,'','#lieu='+encodeURIComponent(p.id))}catch(e){}
 rendre(false);
}
function fermer(){sel=null;panneau='';placer=false;fiche.classList.remove('ouverte');try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}rendre(false)}
/* le logement : marqueur, panneau, changement d'adresse */
function majMaison(){
 if(maisonM){map.removeLayer(maisonM);maisonM=null}
 var b=document.getElementById('tk-maison-btn');
 if(maison){maisonM=L.marker([maison.lat,maison.lon],{icon:L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],html:'<div class="tk-maison" title="'+esc(maison.nom)+'"><i></i><em>Logement</em></div>'}),title:maison.nom,alt:'Notre logement',keyboard:true,zIndexOffset:5000}).addTo(map);maisonM.on('click',function(){ouvrirMaison()});
  b.textContent='Logement · '+(maison.court||maison.nom);b.setAttribute('aria-pressed','true')}
 else{b.textContent='Logement : à régler';b.setAttribute('aria-pressed','false')}
}
function setMaison(o){maison=o;lsSet('tk-maison',o);majMaison();if(o)map.flyTo([o.lat,o.lon],Math.max(map.getZoom(),13),{duration:.6});ouvrirMaison()}
function geocoder(q,cb){
 if(!window.fetch){cb('Recherche impossible ici : placez le point sur la carte.');return}
 fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp&accept-language=fr&q='+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(j){
  if(j&&j[0]&&isFinite(+j[0].lat))cb(null,{lat:+(+j[0].lat).toFixed(6),lon:+(+j[0].lon).toFixed(6),nom:q,periode:'',court:'',marche:null,adresse:j[0].display_name||'',adresse_jp:''});
  else cb('Adresse introuvable. Essayez le nom de l’hôtel ou du quartier, ou placez le point sur la carte.')
 }).catch(function(){cb('Pas de réseau pour chercher l’adresse : placez le point sur la carte.')})}
function ouvrirMaison(){
 sel=null;panneau='maison';rendre(false);
 var h='<div class="tk-fiche-tete" style="--c:#0b0f24"><button class="tk-x" type="button" aria-label="Fermer">×</button><div class="tk-th">Point de départ</div><h3>'+(maison?esc(maison.nom):'Logement à régler')+'</h3>'+(maison&&maison.periode?'<div class="tk-jp">'+esc(maison.periode)+'</div>':'')+'</div><div class="tk-corps">';
 if(maison){
  if(maison.adresse||maison.adresse_jp)h+='<dl class="tk-info">'+ligneInfo('Adresse',maison.adresse)+ligneInfo('En japonais',maison.adresse_jp)+'</dl>';
  if(maison.court&&MAISON_PUB&&maison.court===MAISON_PUB.court&&MAISON_PUB.trajets&&MAISON_PUB.trajets.length){
   h+='<div class="tk-metro"><strong>Depuis la gare de '+esc(MAISON_PUB.gare)+(maison.marche?' ('+esc(maison.marche)+' min à pied)':'')+'</strong>'+MAISON_PUB.trajets.map(function(t){return '<div class="tk-tr">'+esc(t[0])+' : <b>'+esc(t[1])+' min</b> <span class="tk-tr2">'+esc(t[2])+'</span> '+srcTr(t)+'</div>'}).join('')+'</div>'}
  h+='<div class="tk-liens"><a class="tk-btn gm" href="https://www.google.com/maps/search/?api=1&query='+maison.lat+','+maison.lon+'" target="_blank" rel="noopener noreferrer">Google Maps ↗</a><button class="tk-btn sec" id="tk-copier" type="button">Copier le lien avec le logement</button></div>';
 }else h+='<div>L’adresse du logement n’est pas écrite dans la page : elle arrive par le lien partagé, ou se règle ici. Elle reste dans ce navigateur.</div>';
 h+='<div class="tk-sous">'+(maison?'Changer de logement':'Régler le logement')+'</div><div class="tk-form"><input class="tk-champ" id="tk-adr" type="text" placeholder="Adresse ou nom de l’hôtel" aria-label="Adresse du logement"><button class="tk-btn src" id="tk-chercher" type="button">Chercher</button><button class="tk-btn sec" id="tk-placer" type="button">Placer sur la carte</button>'+(maison?'<button class="tk-btn sec" id="tk-effacer" type="button">Effacer</button>':'')+'</div><div class="tk-msg" id="tk-msg" aria-live="polite"></div></div>';
 fiche.innerHTML=h;fiche.style.setProperty('--c','#0b0f24');fiche.scrollTop=0;fiche.classList.add('ouverte');
 fiche.querySelector('.tk-x').onclick=fermer;
 var msg=document.getElementById('tk-msg');
 var cp=document.getElementById('tk-copier');if(cp)cp.onclick=function(){var l=lienMaison();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(l).then(function(){msg.textContent='Lien copié : il ouvre la carte avec ce logement.'},function(){msg.textContent=l});else msg.textContent=l};
 var adr=document.getElementById('tk-adr'),ch=document.getElementById('tk-chercher');
 ch.onclick=function(){var q=adr.value.trim();if(!q){msg.textContent='Tapez une adresse ou un nom d’hôtel.';return}msg.textContent='Recherche…';geocoder(q,function(err,o){if(err){msg.textContent=err;return}setMaison(o)})};
 adr.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();ch.click()}};
 document.getElementById('tk-placer').onclick=function(){placer=true;fiche.classList.remove('ouverte');var a=document.getElementById('tk-aide');a.textContent='Touchez la carte à l’endroit du logement';a.style.opacity=1};
 var ef=document.getElementById('tk-effacer');if(ef)ef.onclick=function(){setMaison(null)};
 document.getElementById('tk-aide').style.opacity=0;
}
document.getElementById('tk-maison-btn').onclick=function(){if(panneau==='maison')fermer();else ouvrirMaison()};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(sel||panneau))fermer()});
map.on('click',function(e){if(placer){placer=false;var a=document.getElementById('tk-aide');a.textContent='Touchez une bulle de quartier pour zoomer, un point pour sa fiche';setMaison({lat:+e.latlng.lat.toFixed(6),lon:+e.latlng.lng.toFixed(6),nom:'Logement (placé sur la carte)',periode:'',court:'',marche:null,adresse:'',adresse_jp:''});return}if(sel||panneau)fermer()});
map.on('zoomend',function(){rendre(false)});
/* molette : seulement après un clic sur la carte, pour ne pas bloquer le défilement de la page */
map.on('focus',function(){map.scrollWheelZoom.enable()});map.on('blur',function(){map.scrollWheelZoom.disable()});
majMaison();
rendre(true);
/* lien direct #lieu=id */
var H1=lireHash();if(H1.lieu){var p0=byId(H1.lieu);if(p0){map.setView([p0.lat,p0.lon],16);ouvrir(p0,false)}}
/* ajustement à l'affichage dans une page qui scrolle */
setTimeout(function(){map.invalidateSize()},300);window.addEventListener('load',function(){map.invalidateSize()});
window.tokyoCarte={map:map,ouvrir:function(id){var p=byId(id);if(p)ouvrir(p,true)},lieux:LIEUX,maison:function(){return maison},setMaison:setMaison};
})();
</script>
</body></html>
